<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>点菜 - Amazing Food</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      @font-face { font-family: 'SF Pro Display'; font-weight: 100 900; font-display: swap; src: local('SF Pro Display'), local('-apple-system'), local('BlinkMacSystemFont'); }
      @font-face { font-family: 'SF Pro Text'; font-weight: 100 900; font-display: swap; src: local('SF Pro Text'), local('-apple-system'), local('BlinkMacSystemFont'); }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: hidden; }
      * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-touch-callout: none; }
      input, textarea, select { font-size: 16px !important; -webkit-appearance: none; appearance: none; }
      button { -webkit-appearance: none; appearance: none; border: none; background: none; padding: 0; margin: 0; cursor: pointer; outline: none; }
      .no-select { -webkit-user-select: none; user-select: none; }
      ::-webkit-scrollbar { width: 0; height: 0; display: none; }
    </style>
  </head>
  <body class="bg-white min-h-screen no-select">
    <div id="app"></div>
    <script type="module" src="/src/guest-main.js"></script>
  </body>
</html>
